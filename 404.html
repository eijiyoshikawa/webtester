<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>404 Not Found | SUISEI STUDIO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700;800&family=Sora:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: "Sora", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 40px;
  }
  .code {
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(100px, 25vw, 300px);
    font-weight: 800;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,0.15);
    margin-bottom: 24px;
  }
  .message {
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #666;
    margin-bottom: 48px;
  }
  .back {
    display: inline-block;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.15em;
    padding: 14px 32px;
    background: linear-gradient(135deg, #FF0055, #8B5CF6);
    color: #fff;
    text-decoration: none;
    transition: opacity 0.3s;
  }
  .back:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="code">404</div>
  <p class="message">PAGE NOT FOUND</p>
  <a href="./" class="back">BACK TO TOP</a>
</body>
</html>
