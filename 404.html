<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:#0f0f1e;font-family:'Noto Sans JP','Inter',sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow-x:hidden}

.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 32px;border-radius:999px;background:linear-gradient(135deg,#d946ef 0%,#8b5cf6 50%,#06b6d4 100%);color:#fff;font-weight:800;font-size:0.96rem;text-decoration:none;box-shadow:0 12px 30px rgba(217,70,239,0.22),0 4px 60px rgba(6,182,212,0.10);transition:transform .25s,box-shadow .25s}
